# Local testing stack: the app plus a MySQL that is utf8mb4 from the start.
#
#   docker compose up --build
#   open http://localhost:8000/
#
# Run the verification suite inside the container:
#   docker compose exec app php selftest.php

services:
  db:
    image: mysql:8.0
    # Survive a host reboot without anyone having to log in and start it.
    restart: unless-stopped
    # The server defaults matter. A MySQL that defaults to latin1 will accept
    # utf8mb4 columns but hand back mangled bytes on any connection that does
    # not override the charset — exactly the failure this project exists to
    # avoid. Set it at the server, not just per connection.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    # No `ports:` here on purpose — MySQL stays on the internal Docker network
    # and is never reachable from outside the host.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: translit_demo
      MYSQL_USER: translit
      MYSQL_PASSWORD: ${DB_PASSWORD:-translit}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

  app:
    restart: unless-stopped
    build:
      context: .
      args:
        # Override to 7.4 to check the legacy compatibility CLAUDE.md requires:
        #   docker compose build --build-arg PHP_VERSION=7.4
        PHP_VERSION: "8.2"
    ports:
      # Override with APP_PORT in .env — e.g. APP_PORT=5000.
      - "${APP_PORT:-8000}:80"
    environment:
      TRANSLIT_DB_HOST: db
      TRANSLIT_DB_PORT: "3306"
      TRANSLIT_DB_NAME: translit_demo
      TRANSLIT_DB_USER: translit
      TRANSLIT_DB_PASS: ${DB_PASSWORD:-translit}
      # Defaults to 0 (errors hidden) because this stack is also the deployment
      # path. Set TRANSLIT_DEBUG=1 in .env when testing locally.
      TRANSLIT_DEBUG: ${TRANSLIT_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
